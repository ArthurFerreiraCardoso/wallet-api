spring.application.name=wallet-api

# A aplicacao conecta sempre como WALLET_APP: sem DML direto, apenas EXECUTE no package e READ nas views.
# Recebe so a propria senha; as senhas do owner, do audit e do SYS nunca chegam ao processo da aplicacao.
spring.datasource.url=${WALLET_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=WALLET_APP
spring.datasource.password=${WALLET_APP_PASSWORD}
spring.datasource.hikari.pool-name=wallet-app
# Uma requisicao pode segurar a conexao por ate 5 s esperando o lock de uma carteira disputada. Com o pool cheio,
# a proxima desiste em 5 s com 503 SERVICE_BUSY em vez de esperar os 30 s padrao.
spring.datasource.hikari.connection-timeout=5000

logging.pattern.correlation=[%X{traceId:-}]

# API key exigida no header X-API-Key (minimo 16 caracteres). Sem ela a aplicacao nao sobe.
wallet.security.api-key=${WALLET_API_KEY:}
# Sem usuario em memoria: a autenticacao e so por API key (e o Spring deixa de gerar e logar uma senha padrao).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
