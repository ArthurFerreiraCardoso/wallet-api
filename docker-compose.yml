services:
  oracle:
    image: gvenzl/oracle-free:23.26.4-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?defina ORACLE_PASSWORD no .env}
      WALLET_OWNER_PASSWORD: ${WALLET_OWNER_PASSWORD:?defina WALLET_OWNER_PASSWORD no .env}
      WALLET_APP_PASSWORD: ${WALLET_APP_PASSWORD:?defina WALLET_APP_PASSWORD no .env}
      WALLET_AUDIT_PASSWORD: ${WALLET_AUDIT_PASSWORD:?defina WALLET_AUDIT_PASSWORD no .env}
    ports:
      # Publicado so em localhost: o banco nao fica exposto na rede.
      - "127.0.0.1:${ORACLE_PORT:-1521}:1521"
    volumes:
      - ./db/init:/container-entrypoint-initdb.d:ro
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30

  # Aplica as migrations e termina. O healthcheck da imagem so fica "healthy" depois que db/init terminou,
  # entao os usuarios ja existem quando o Flyway conecta. Ordem fixa: audit, depois owner.
  migrate:
    image: flyway/flyway:12.4.0
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      WALLET_OWNER_PASSWORD: ${WALLET_OWNER_PASSWORD:?defina WALLET_OWNER_PASSWORD no .env}
      WALLET_AUDIT_PASSWORD: ${WALLET_AUDIT_PASSWORD:?defina WALLET_AUDIT_PASSWORD no .env}
    volumes:
      - ./db/migration:/flyway/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - >-
        FLYWAY_USER=WALLET_AUDIT FLYWAY_PASSWORD="$$WALLET_AUDIT_PASSWORD"
        flyway -locations=filesystem:/flyway/migrations/audit migrate &&
        FLYWAY_USER=WALLET_OWNER FLYWAY_PASSWORD="$$WALLET_OWNER_PASSWORD"
        flyway -locations=filesystem:/flyway/migrations/owner migrate
    restart: "no"

  # A API. So sobe depois do banco saudavel e das migrations aplicadas. Recebe apenas as proprias variaveis:
  # as senhas do owner, do audit e do SYS nao chegam a este container.
  app:
    build: .
    image: wallet-api:local
    depends_on:
      oracle:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      WALLET_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      WALLET_APP_PASSWORD: ${WALLET_APP_PASSWORD:?defina WALLET_APP_PASSWORD no .env}
      WALLET_API_KEY: ${WALLET_API_KEY:?defina WALLET_API_KEY no .env}
      # Logs em JSON (formato ECS) dentro do container, prontos para um coletor de logs.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    # Container endurecido: sistema de arquivos so leitura (so /tmp gravavel, usado pelo Tomcat),
    # nenhuma capability do Linux e sem escalada de privilegio.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Teste de carga (so roda sob demanda: docker compose --profile load run --rm k6). Ver load-test/README.md.
  k6:
    image: grafana/k6:1.8.3
    profiles: ["load"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:8080
      K6_NO_USAGE_REPORT: "true"
      WALLET_API_KEY: ${WALLET_API_KEY:?defina WALLET_API_KEY no .env}
    volumes:
      - ./load-test:/scripts:ro
    command: ["run", "/scripts/wallet-load.js"]

volumes:
  oracle-data:
